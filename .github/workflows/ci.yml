name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Unit tests
        run: npm run test

  build:
    name: Build & package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Chrome build
        run: ./scripts/package-chrome.sh

      - name: Package Firefox build
        run: ./scripts/package-firefox.sh

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkding-chrome
          path: linkding-chrome.zip
          retention-days: 14

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkding-firefox
          path: linkding-firefox.zip
          retention-days: 14
